<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4A31">
<title>Sarapan Pintar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="SARAPAN PINTAR — Kenali Gizimu, Mulai dari Sarapan Lokal. Prototipe edukasi gizi sarapan pangan lokal Jember.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar kiri (desktop) / navigasi bawah (ponsel); dashboard berbasis kartu ringkas di atas krem terang */
:root{
  --bg:#FAF6EC; --surface:#FFFFFF; --surface-2:#F2EDDD; --line:#E3DAC4;
  --ink:#18261D; --muted:#55645A; --leaf:#3B8A4A; --leaf-soft:#E2F0DF;
  --forest:#1E4A31; --sun:#E7AE2F; --sun-soft:#FBEFC9; --sun-ink:#6E4B07;
  --danger:#B0412A; --danger-soft:#F8E1DA; --info:#2D6A8A;
  --primary:#1E4A31; --on-primary:#FFFFFF; --hero-bg:#1E4A31;
  --shadow:0 1px 2px rgba(30,74,49,.06),0 6px 20px rgba(30,74,49,.07);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --c-pokok:#E7C66A; --c-lauk:#C9824A; --c-sayur:#5FA35A; --c-buah:#F0B43C; --c-kacang:#B99366; --c-lemak:#D9B13B; --c-minum:#9CC3D5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#19231C; --surface-2:#202C23; --line:#2F3D33;
  --ink:#ECF2EC; --muted:#A3B3A7; --leaf:#72C482; --leaf-soft:#22382A;
  --forest:#A9DAB4; --sun:#F1C255; --sun-soft:#3A3117; --sun-ink:#F6D98E;
  --danger:#E8836B; --danger-soft:#3D2620; --info:#7DB8D6;
  --primary:#72C482; --on-primary:#0E1A12; --hero-bg:#1F3D2B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#19231C; --surface-2:#202C23; --line:#2F3D33;
  --ink:#ECF2EC; --muted:#A3B3A7; --leaf:#72C482; --leaf-soft:#22382A;
  --forest:#A9DAB4; --sun:#F1C255; --sun-soft:#3A3117; --sun-ink:#F6D98E;
  --danger:#E8836B; --danger-soft:#3D2620; --info:#7DB8D6;
  --primary:#72C482; --on-primary:#0E1A12; --hero-bg:#1F3D2B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
a{color:var(--leaf)}

/* Shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;display:block;color:var(--forest)}
.brand small{color:var(--muted);font-size:.72rem;display:block;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:600}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--leaf-soft);color:var(--forest)}
.nav button:focus-visible{outline:3px solid var(--sun)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:var(--muted)}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:none}
.bottomnav{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .main{padding-block:16px 110px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottomnav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.68rem;font-weight:600;color:var(--muted);text-align:center}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button[aria-current="page"]{color:var(--forest);background:var(--leaf-soft)}
}

/* Common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g5>:first-child{grid-column:1/-1}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2B1E02}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.sim{background:var(--sun-soft);color:var(--sun-ink)}
.chip.ok{background:var(--leaf-soft);color:var(--forest)}
.chip.raw{background:var(--surface-2);color:var(--muted)}
.chip.local{background:var(--leaf-soft);color:var(--forest)}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
label{font-weight:600;font-size:.85rem}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field .hint{font-size:.76rem;color:var(--muted);font-weight:400}
.field .err{font-size:.78rem;color:var(--danger);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:0;border-color:var(--leaf)}
input[aria-invalid="true"]{border-color:var(--danger);background:var(--danger-soft)}
textarea{min-height:70px;resize:vertical}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-sm);font-size:.86rem;font-weight:500}
.banner.demo{background:var(--sun-soft);color:var(--sun-ink);border:1px solid var(--sun)}
.banner.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.banner.info{background:var(--leaf-soft);color:var(--forest)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}

/* Dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .date{color:var(--muted);font-weight:500}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-main{background:var(--hero-bg);color:#F3F7F1;border:0}
.hero-main .eyebrow{color:inherit;opacity:.75}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,6vw,3.4rem);line-height:1;letter-spacing:-.02em}
.big small{font-size:1rem;font-weight:600;opacity:.8;margin-left:4px;letter-spacing:0}
.gauge{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.18);margin:18px 0 6px}
.gauge .band{position:absolute;top:-3px;bottom:-3px;border:1.5px dashed rgba(255,255,255,.85);border-radius:4px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--sun)}
.gauge-scale{display:flex;justify-content:space-between;font-size:.72rem;opacity:.8}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:.75rem;opacity:.8}
.macro{display:flex;flex-direction:column;gap:8px}
.macro .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.macro .v small{font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--leaf)}
.bar i.over{background:var(--sun)}
.macro .t{font-size:.76rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.loglist{display:flex;flex-direction:column}
.logitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.logitem .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.logitem .ic svg{width:44px;height:44px}
.logitem .nm{font-weight:700;overflow-wrap:anywhere}
.logitem .meta{font-size:.78rem;color:var(--muted)}
.logitem .kc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.logitem .acts{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.split{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;height:100%}

/* Catat */
.catat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:960px){.catat{grid-template-columns:1fr}}
.results{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto;margin-top:10px}
.res{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.res:hover,.res:focus-visible{border-color:var(--leaf);background:var(--leaf-soft)}
.res b{display:block;font-size:.9rem}
.res small{color:var(--muted);font-size:.74rem}
.res .plus{font-weight:800;color:var(--leaf);font-size:1.2rem}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.item .nm{font-weight:700;font-size:.9rem}
.item .calc{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gram{position:relative}
.gram input{padding-right:30px;text-align:right}
.gram span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.totals div{display:flex;flex-direction:column}
.totals b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.totals span{font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:520px){.totals{grid-template-columns:repeat(3,minmax(0,1fr))}}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.iconbtn:hover{background:var(--danger-soft);color:var(--danger)}
.iconbtn svg{width:18px;height:18px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.span2{grid-column:1/-1}

/* Katalog */
.tabs{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.tabs button{all:unset;cursor:pointer;padding:7px 16px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--forest);box-shadow:var(--shadow)}
.menus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.menu-card{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.menu-card .pic{background:var(--surface-2);display:grid;place-items:center;padding:14px;position:relative}
.menu-card .pic svg{width:132px;height:132px}
.menu-card .pic .chip{position:absolute;top:10px;left:10px}
.menu-card .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.menu-card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.78rem;color:var(--muted)}
.menu-card .stats b{display:block;color:var(--ink);font-size:.98rem;font-variant-numeric:tabular-nums}
.menu-card .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.menu-card .acts .btn{flex:1}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.modal-bg{align-items:center;padding:24px}}
.modal{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media (min-width:700px){.modal{border-radius:18px}}
.modal.sm{max-width:440px}
.modal>*{flex-shrink:0}
.mstats{grid-template-columns:repeat(3,minmax(0,1fr))}
.modal-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-x{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;flex:none;background:var(--surface-2)}
.modal-x svg{width:18px;height:18px}
.qrbox{display:grid;place-items:center;background:#fff;border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.qrbox img{width:240px;height:240px;image-rendering:pixelated;max-width:100%}
.urlbox{display:flex;gap:8px}
.urlbox input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:200;max-width:calc(100% - 32px);text-align:center}
@media (min-width:861px){.toast{bottom:28px}}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose h2{margin-top:10px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:10px 12px;border-radius:var(--r-sm);font-size:.85rem;overflow-x:auto}
#print-area{display:none}
@media print{
  body.printing-qr .shell,body.printing-qr .modal-bg,body.printing-qr .toast,body.printing-qr .bottomnav,body.printing-qr .topbar{display:none!important}
  body.printing-qr #print-area{display:flex!important;flex-direction:column;align-items:center;gap:12px;padding:40px;font-family:var(--f-body);color:#000}
  body.printing-qr #print-area img{width:8cm;height:8cm;image-rendering:pixelated}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="shell">
  <aside class="side" aria-label="Navigasi utama">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle style="fill:var(--leaf-soft)" cx="20" cy="20" r="19"/><circle style="fill:var(--surface);stroke:var(--forest)" cx="20" cy="22" r="11" stroke-width="2"/><circle style="fill:var(--sun)" cx="20" cy="22" r="5"/><path style="fill:var(--leaf)" d="M20 3c4 3 5 7 3 11-4-1-6-5-3-11z"/></svg>
      <div><b>SARAPAN PINTAR</b><small>Kenali Gizimu, Mulai dari Sarapan Lokal</small></div>
    </div>
    <nav class="nav" id="sidenav"></nav>
    <div class="side-foot">
      <button class="btn sm ghost" data-action="go" data-view="tentang" style="justify-content:flex-start">Tentang &amp; Metodologi</button>
      <span>Prototipe edukasi, bukan alat diagnosis.</span>
    </div>
  </aside>
  <div style="min-width:0">
    <header class="topbar">
      <div class="brand" style="padding:0">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle style="fill:var(--leaf-soft)" cx="20" cy="20" r="19"/><circle style="fill:var(--surface);stroke:var(--forest)" cx="20" cy="22" r="11" stroke-width="2"/><circle style="fill:var(--sun)" cx="20" cy="22" r="5"/><path style="fill:var(--leaf)" d="M20 3c4 3 5 7 3 11-4-1-6-5-3-11z"/></svg>
        <div><b>SARAPAN PINTAR</b><small>Kenali Gizimu, Mulai dari Sarapan Lokal</small></div>
      </div>
      <button class="btn sm" data-action="go" data-view="tentang" aria-label="Tentang dan Metodologi">Info</button>
    </header>
    <main class="main" id="main" tabindex="-1">

var QR8bitByte = require('./QR8bitByte');
var QRUtil = require('./QRUtil');
var QRPolynomial = require('./QRPolynomial');
var QRRSBlock = require('./QRRSBlock');
var QRBitBuffer = require('./QRBitBuffer');

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

}

/* ---------- 3. MESIN PERHITUNGAN GIZI ---------- */
function toNum(v){ if(v===null||v===undefined||v==="") return null; const n=Number(v); return Number.isFinite(n)?n:null; }
// Nutrisi satu bahan = berat (g) / 100 × nilai per 100 g. Nilai tidak tersedia → null (bukan NaN).
function nutrientsOfItem(per100, grams){
  const g = toNum(grams); const out = {};
  NKEYS.forEach(k=>{ const v = per100 ? toNum(per100[k]) : null; out[k] = (g===null||g<=0||v===null) ? null : v*g/100; });
  return out;
}
// Jumlahkan beberapa hasil; catat nutrien yang datanya tidak lengkap.
function sumNutrients(list){
  const t = {missing:{}}; NKEYS.forEach(k=>t[k]=0);
  list.forEach(n=>NKEYS.forEach(k=>{ if(n[k]===null||n[k]===undefined) t.missing[k]=true; else t[k]+=n[k]; }));
  return t;
}
function per100Of(item){
  if(item.per100) return item.per100;
  const f = foodById(item.foodId); return f ? f : null;
}
function recipeTotals(items){ return sumNutrients((items||[]).map(i=>nutrientsOfItem(per100Of(i), i.grams))); }
// Persentase hanya bila target valid.
function pctOf(value, target){ const v=toNum(value), t=toNum(target); if(v===null||t===null||t<=0) return null; return v/t*100; }
function foodById(id){ return state.foods.find(f=>f.id===id) || null; }
function menuById(id){ return state.menus.find(m=>m.id===id) || null; }
function snapshotItem(foodId, grams){
  const f = foodById(foodId); if(!f) return null;
  const per100={}; NKEYS.forEach(k=>per100[k]=toNum(f[k]));
  return {foodId:f.id,name:f.name,state:f.state,status:f.status,local:!!f.local,cat:f.cat,grams:toNum(grams),per100};
}

/* ---------- 4. TARGET HARIAN ---------- */
function getTargets(){
  const p = state.profile;
  if(!state.settings.useAkg) return {ok:false,reason:"Target AKG dimatikan di Pengaturan. Dashboard hanya menampilkan asupan tercatat."};
  if(!p) return {ok:false,reason:"Profil belum diisi, jadi target personal belum ditetapkan."};
  if(p.sex!=="L" && p.sex!=="P") return {ok:false,reason:"Tabel AKG 2019 dibedakan menurut jenis kelamin. Pilih jenis kelamin di Profil agar target bisa ditentukan."};
  const row = AKG_2019.find(r=>r.sex===p.sex && p.age>=r.min && p.age<=r.max);
  if(!row) return {ok:false,reason:`Aplikasi ini baru memuat tabel AKG untuk usia 10–49 tahun. Untuk usia ${p.age} tahun target belum dikonfigurasi.`};
  return {ok:true,row,values:{kcal:row.kcal,protein:row.protein,carb:row.carb,fat:row.fat,fiber:row.fiber},
    group:`${p.sex==="L"?"Laki-laki":"Perempuan"} ${row.min}–${row.max} tahun`};
}

// Ilustrasi piring lokal (SVG): irisan sebanding berat bahan, warna per kategori.
function plateSVG(items, size){
  const parts = (items||[]).map(i=>{ const f=foodById(i.foodId); const cat=i.cat||(f&&f.cat)||"pokok"; return {cat,g:Math.max(0,toNum(i.grams)||0)}; }).filter(p=>p.cat!=="lemak"&&p.g>0);
  const total = parts.reduce((a,p)=>a+p.g,0);
  let a0=-Math.PI/2, paths="";
  const r=34, cx=50, cy=50;
  if(total>0) parts.forEach(p=>{ const a1=a0+p.g/total*Math.PI*2; const large=(a1-a0)>Math.PI?1:0;
    if(parts.length===1){ paths+=`<circle style="fill:var(--c-${p.cat})" cx="50" cy="50" r="${r}"/>`; }
    else paths+=`<path style="fill:var(--c-${p.cat});stroke:var(--surface)" d="M${cx},${cy} L${(cx+r*Math.cos(a0)).toFixed(2)},${(cy+r*Math.sin(a0)).toFixed(2)} A${r},${r} 0 ${large} 1 ${(cx+r*Math.cos(a1)).toFixed(2)},${(cy+r*Math.sin(a1)).toFixed(2)} Z" stroke-width="1.5"/>`;
    a0=a1; });
  return `<svg viewBox="0 0 100 100" width="${size||100}" height="${size||100}" aria-hidden="true"><circle style="fill:var(--surface);stroke:var(--line)" cx="50" cy="50" r="47" stroke-width="2"/><circle style="stroke:var(--line)" cx="50" cy="50" r="40" fill="none" stroke-width="1"/>${paths}</svg>`;
}

  }).join("");

  // Grafik 7 hari
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(today,-i));

  return `<div class="grid" style="gap:18px">

      <div class="card"><div class="card-h"><h2>Catatan hari ini</h2><button class="btn sm ghost" data-action="go" data-view="riwayat">Lihat riwayat</button></div><div class="loglist">${list}</div></div>
    </section>

  </div>`;
}
function weekChart(series, target){
  const narrow=window.innerWidth<600; const W=narrow?360:640,H=narrow?240:230,pl=40,pr=8,pt=14,pb=34; const iw=W-pl-pr, ih=H-pt-pb;
  const maxV = Math.max(target||0, ...series.map(s=>s.b+s.o), 500);
  const step = maxV>3000?1000:500; const top = Math.ceil(maxV*1.08/step)*step;
  const y = v => pt+ih-(v/top)*ih;
  let g=""; for(let v=0; v<=top; v+=step){ g+=`<line style="stroke:var(--line)" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke-width="1"/><text style="fill:var(--muted)" x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11">${fmt0.format(v)}</text>`; }
  const bw = iw/series.length*0.56;
  const bars = series.map((s,i)=>{ const cx=pl+iw/series.length*(i+.5); const x=cx-bw/2;
    const hb=(s.b/top)*ih, ho=(s.o/top)*ih; const isToday=i===series.length-1;
    const lbl = dateLabel(s.d,{weekday:"short"});
    return `<g><title>${dateLabel(s.d,{weekday:"long",day:"numeric",month:"short"})}: sarapan ${fmt0.format(s.b)} kkal, lainnya ${fmt0.format(s.o)} kkal</title>
      ${ho>0?`<rect style="fill:var(--leaf)" x="${x}" y="${y(s.b+s.o)}" width="${bw}" height="${ho}" rx="3" opacity="${isToday?1:.75}"/>`:""}
      ${hb>0?`<rect style="fill:var(--sun)" x="${x}" y="${y(s.b)}" width="${bw}" height="${hb}" rx="3"/>`:""}
      ${s.b+s.o>0?`<text style="fill:var(--ink)" x="${cx}" y="${y(s.b+s.o)-5}" text-anchor="middle" font-size="10.5" font-weight="700">${fmt0.format(s.b+s.o)}</text>`:""}
      <text x="${cx}" y="${H-12}" text-anchor="middle" font-size="11.5" font-weight="${isToday?700:500}" style="fill:${isToday?"var(--ink)":"var(--muted)"}">${isToday?"Hari ini":esc(lbl)}</text></g>`; }).join("");
  const tl = target?`<line style="stroke:var(--muted)" x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke-width="1.5" stroke-dasharray="5 4"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik batang energi tercatat tujuh hari terakhir">${g}${bars}${tl}</svg>`;
}
function logRow(l){
  const t=recipeTotals(l.items);
  return `<div class="logitem"><div class="ic">${plateSVG(l.items,44)}</div>
    <div style="min-width:0"><div class="nm">${esc(l.name)}</div><div class="meta">${esc(sessionLabel(l.session))} · ${esc(l.time||"")} · ${l.source==="menu"?"dari menu":"manual"}${hasSim(l.items)?' · <span class="chip sim">SIMULASI</span>':""}</div></div>

function validateDraft(){
  const errs=[];
  if(!draft.items.length) errs.push("Tambahkan minimal satu bahan.");
  draft.items.forEach(it=>{ const g=toNum(it.grams); const f=foodById(it.foodId); if(g===null||g<=0) errs.push(`Berat ${f?f.name:"bahan"} harus lebih dari 0 g.`); else if(g>2000) errs.push(`Berat ${f?f.name:"bahan"} terlalu besar (maks. 2.000 g per bahan).`); });
  if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date||"")) errs.push("Pilih tanggal yang valid.");
  else if(draft.date>addDays(todayKey(),1)) errs.push("Tanggal tidak boleh lebih dari besok.");
  if(!/^\d{2}:\d{2}$/.test(draft.time||"")) errs.push("Isi jam makan.");
  if(draft.cost!==""&&draft.cost!==null&&(toNum(draft.cost)===null||toNum(draft.cost)<0||toNum(draft.cost)>1000000)) errs.push("Biaya harus angka 0–1.000.000.");

    cost:draft.cost===""||draft.cost===null?null:toNum(draft.cost),items,updatedAt:new Date().toISOString()};

/* ---------- 10. QR ---------- */
function baseUrl(){
  const s=(state.settings.qrBase||"").trim(); if(s) return s;
  if(/^https?:$/.test(location.protocol)) return location.origin+location.pathname;
  return location.href.split(/[?#]/)[0];
}
function menuUrl(id){ const b=baseUrl(); return /claude\.ai\//.test(b) ? b.split("#")[0]+"#"+id : b.split("?")[0]+"?menu="+encodeURIComponent(id); }
function qrDataUrl(text){
  if(!window.SPQR) return null;
  try{
    const q=new window.SPQR.QRCode(-1, window.SPQR.Level.M); q.addData(text); q.make();
    const n=q.getModuleCount(), cell=8, m=4, size=(n+m*2)*cell;
    const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,size,size); x.fillStyle="#000";
    for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
    return c.toDataURL("image/png");
  }catch(e){ console.error(e); return null; }
}
function menuQR(id){
  const m=menuById(id); if(!m) return;
  const url=menuUrl(id); const img=qrDataUrl(url);
  const local = /^file:/.test(url) || /localhost|127\.0\.0\.1/.test(url);
  openModal(`<div class="modal-h"><div><span class="eyebrow">QR menu</span><h2 style="margin-top:4px">${esc(m.name)}</h2></div>${xBtn()}</div>
    ${img?`<div class="qrbox"><img id="qr-img" src="${img}" alt="QR Code untuk ${esc(m.name)}"></div>`:`<div class="banner err">Pembuat QR tidak tersedia di browser ini. Salin URL di bawah lalu buat QR dengan aplikasi pembuat QR apa pun.</div>`}
    <div class="field"><label for="qr-url">URL menu</label><div class="urlbox"><input type="text" id="qr-url" readonly value="${esc(url)}"><button class="btn" data-action="copy-url">Salin</button></div>
      <span class="hint">QR hanya berisi alamat ini dan kode <b>${esc(id)}</b>. Pencegahan pencatatan ganda dilakukan oleh aplikasi di tiap perangkat, bukan oleh QR.</span></div>
    ${local?`<div class="banner demo"><span>Alamat ini masih file lokal, jadi ponsel lain tidak bisa membukanya. Unggah aplikasi ke hosting statis gratis lalu isi <b>URL aplikasi</b> di Profil → Pengaturan.</span></div>`:""}
    <div class="row">${img?`<button class="btn primary" data-action="qr-download" data-id="${esc(id)}">Simpan gambar QR</button><button class="btn" data-action="qr-print" data-id="${esc(id)}">Cetak QR</button>`:""}<button class="btn" data-action="menu-detail" data-id="${esc(id)}">Detail menu</button></div>`,"sm");
}
function downloadBlob(name, data, type){
  try{ const blob = data instanceof Blob ? data : new Blob([data],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); return true; }
  catch(e){ toast("Browser ini memblokir unduhan. Gunakan tombol Salin."); return false; }
}

let histDays = 14;
function vRiwayat(){
  const dates=[...new Set(state.logs.map(l=>l.date))].sort().reverse();
  const shown=dates.slice(0,histDays);
  const body = shown.length ? shown.map(d=>{ const ls=logsOn(d); const t=totalsForLogs(ls); const cost=ls.reduce((a,l)=>a+(toNum(l.cost)||0),0);
    return `<section class="card"><div class="card-h"><h3>${esc(dateLabel(d))}${d===todayKey()?' <span class="chip ok">Hari ini</span>':""}</h3><span class="small muted num">${fmt0.format(t.kcal)} kkal · P ${fmt1.format(t.protein)} g · ${fmtRp(cost)}</span></div><div class="loglist">${ls.map(logRow).join("")}</div></section>`; }).join("")
    : `<div class="empty"><b>Riwayat masih kosong.</b><span>Catatan yang kamu simpan akan muncul di sini.</span><button class="btn primary" data-action="go" data-view="catat">Catat sarapan</button></div>`;
  return `<div class="grid" style="gap:18px"><div class="hello"><div><p class="date">${state.logs.length} catatan tersimpan di perangkat ini</p><h1>Riwayat</h1></div>
    <div class="row"><button class="btn sm" data-action="export-json">Ekspor JSON</button><button class="btn sm" data-action="export-csv">Ekspor CSV</button><label class="btn sm" for="import-file" style="cursor:pointer">Impor JSON</label><input type="file" id="import-file" accept="application/json,.json" style="position:absolute;left:-9999px" data-change="import"></div></div>
    ${body}${dates.length>histDays?`<button class="btn" data-action="more-hist">Tampilkan lebih banyak</button>`:""}</div>`;
}
function exportPayload(){ return {app:"SARAPAN PINTAR",schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),kind:state.kind,profile:state.profile,settings:state.settings,foods:state.foods,menus:state.menus,logs:state.logs}; }
function exportCSV(){
  const head=["tanggal","jam","waktu_makan","nama","sumber","kode_menu","energi_kkal","protein_g","karbohidrat_g","lemak_g","serat_g","biaya_rp","ada_simulasi"];
  const q=v=>{ const s=String(v??""); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=state.logs.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(l=>{ const t=recipeTotals(l.items); return [l.date,l.time,sessionLabel(l.session),l.name,l.source,l.menuId||"",t.kcal.toFixed(0),t.protein.toFixed(1),t.carb.toFixed(1),t.fat.toFixed(1),t.missing.fiber?"":t.fiber.toFixed(1),l.cost??"",hasSim(l.items)?"ya":"tidak"].map(q).join(","); });
  return "﻿"+head.join(",")+"\n"+rows.join("\n");
}
function validateImport(o){
  if(!o||typeof o!=="object") return "Berkas bukan JSON objek.";
  if(o.app!=="SARAPAN PINTAR") return "Berkas ini bukan ekspor SARAPAN PINTAR.";
  if(o.schemaVersion!==SCHEMA_VERSION) return `Versi data ${o.schemaVersion} tidak didukung (butuh ${SCHEMA_VERSION}).`;
  if(!Array.isArray(o.logs)||!Array.isArray(o.foods)||!Array.isArray(o.menus)) return "Struktur data tidak lengkap.";
  for(const l of o.logs){ if(!l||!/^\d{4}-\d{2}-\d{2}$/.test(l.date)||!Array.isArray(l.items)) return "Ada catatan dengan tanggal atau bahan tidak valid.";
    for(const i of l.items){ if(!(toNum(i.grams)>0)||!i.per100||toNum(i.per100.kcal)===null) return "Ada bahan dengan berat atau nilai gizi tidak valid."; } }
  for(const f of o.foods){ if(!f||!f.id||!f.name||toNum(f.kcal)===null) return "Ada bahan di database tanpa nama atau energi."; }
  return null;
}

function vProfil(){
  const p=state.profile||{nick:"",age:"",sex:"",weight:"",height:"",activity:""};
  const tg=getTargets();

    ${state.profile&&Math.abs(state.profile.weight-tg.row.bb)/tg.row.bb>0.2?`<div class="banner demo"><span>Berat badanmu berbeda lebih dari 20% dari berat rujukan AKG kelompok ini (${tg.row.bb} kg). Kebutuhan sebenarnya bisa berbeda; konsultasikan dengan tenaga gizi.</span></div>`:""}`
    : `<div class="banner demo"><span><b>Target personal belum ditetapkan.</b> ${esc(tg.reason)}</span></div>`;

      <div class="field span2"><label for="p-activity">Tingkat aktivitas fisik</label><select id="p-activity"><option value="" ${!p.activity?"selected":""}>Pilih…</option><option value="rendah" ${p.activity==="rendah"?"selected":""}>Rendah — banyak duduk</option><option value="sedang" ${p.activity==="sedang"?"selected":""}>Sedang — aktif berjalan, olahraga ringan</option><option value="tinggi" ${p.activity==="tinggi"?"selected":""}>Tinggi — olahraga rutin/berat</option></select><span class="hint">Dicatat sebagai konteks. AKG 2019 tidak menyesuaikan target menurut aktivitas, jadi target tidak berubah.</span></div>

function bindProfile(){
  const form=document.getElementById("profile-form"); if(!form) return;
  form.addEventListener("submit",e=>{ e.preventDefault();
    const g=id=>document.getElementById(id).value.trim(); const errs=[]; const mark=(id,bad)=>document.getElementById(id).setAttribute("aria-invalid",String(bad));
    const age=toNum(g("p-age")), w=toNum(g("p-weight")), h=toNum(g("p-height"));
    const ageBad=age===null||!Number.isInteger(age)||age<5||age>100; mark("p-age",ageBad); if(ageBad) errs.push("Usia harus bilangan bulat 5–100 tahun.");
    const wBad=w===null||w<15||w>250; mark("p-weight",wBad); if(wBad) errs.push("Berat badan harus 15–250 kg.");
    const hBad=h===null||h<90||h>230; mark("p-height",hBad); if(hBad) errs.push("Tinggi badan harus 90–230 cm.");
    if(!g("p-activity")) errs.push("Pilih tingkat aktivitas fisik.");
    if(!ageBad&&!wBad&&!hBad){ const bmi=w/((h/100)**2); if(bmi<10||bmi>60) errs.push("Kombinasi berat dan tinggi tidak masuk akal. Periksa kembali angkanya."); }
    if(errs.length){ document.getElementById("p-err").innerHTML=`<div class="banner err">${errs.map(esc).join("<br>")}</div>`; return; }
    state.profile={nick:g("p-nick").slice(0,30),age,sex:g("p-sex"),weight:w,height:h,activity:g("p-activity")};
    saveState(); toast("Profil disimpan"); render();
  });
}

/* ---------- 13. TENTANG & METODOLOGI ---------- */
function vTentang(){
  return `<div class="grid" style="gap:18px"><div class="hello"><div><p class="date">SARAPAN PINTAR · versi data ${SCHEMA_VERSION}</p><h1>Tentang &amp; Metodologi</h1></div><button class="btn" data-action="go" data-view="dashboard">Kembali ke dashboard</button></div>
  <div class="card prose">
    <p><b>SARAPAN PINTAR</b> adalah prototipe edukasi gizi untuk proyek kokurikuler. Hasilnya adalah <b>estimasi</b>, bukan diagnosis, bukan rekomendasi medis personal, dan belum diuji akurasinya terhadap penimbangan atau analisis laboratorium.</p>
    <h2>Cara menghitung nutrisi</h2>
    <div class="formula">Nutrisi bahan = berat bagian yang dimakan (g) ÷ 100 × nilai per 100 g</div>
    <p>Nilai semua bahan dijumlahkan untuk satu menu, lalu semua catatan dijumlahkan untuk satu hari. Bila nilai serat sebuah bahan belum tersedia, total serat ditandai "≥" (nilai minimal) dan tidak diisi angka karangan. Hasil dibulatkan: energi ke kkal terdekat, zat gizi lain 1 desimal.</p>
    <h2>Sumber data komposisi pangan</h2>
    <ul><li><b>TKPI 2017</b> (Tabel Komposisi Pangan Indonesia, Kemenkes RI; dapat dicek di panganku.org): nasi, telur ayam ras, tempe, tahu.</li>
    <li><b>USDA FoodData Central, SR Legacy</b>: sayur, buah, kacang tanah, edamame, ubi, singkong, jagung, susu, ayam, minyak. Dipakai karena datanya terbuka; nilai varietas Indonesia bisa berbeda.</li>
    <li><b>SIMULASI</b>: tape singkong. Ditandai kuning di seluruh aplikasi dan tidak boleh dianggap data rujukan.</li></ul>
    <p>Nilai dimasukkan secara manual dari sumber di atas. Sebelum presentasi, cocokkan ulang setiap angka dengan sumber aslinya; semua nilai bisa dikoreksi di Katalog → Database bahan.</p>
    <h2>Bahan mentah dan matang</h2>
    <p>Setiap bahan diberi label <b>mentah</b> atau <b>matang</b>. Berat yang dimasukkan harus sesuai label itu: nasi ditimbang matang, sedangkan tempe, tahu, dan sayur ditimbang mentah sebelum dimasak. Aplikasi tidak mengonversi berat matang ke mentah karena faktor penyusutan/penyerapan air belum tersedia. Minyak goreng dicatat terpisah sebagai perkiraan minyak yang terserap.</p>
    <h2>Estimasi kebutuhan harian</h2>
    <p>Target memakai <b>Angka Kecukupan Gizi (AKG) 2019</b>, Permenkes RI No. 28 Tahun 2019, menurut kelompok usia dan jenis kelamin (usia 10–49 tahun). Rumus energi dewasa tidak dipakai untuk remaja. AKG adalah angka kecukupan rata-rata kelompok dengan berat dan tinggi rujukan, sehingga bukan kebutuhan individual. Aktivitas fisik dicatat tetapi tidak mengubah target. Di luar rentang usia itu, atau bila target dimatikan, dashboard hanya menampilkan asupan tanpa persentase.</p>
    <p>Rentang energi sarapan 15–30% dari kebutuhan harian mengikuti anjuran sarapan dalam Pedoman Gizi Seimbang (Kemenkes RI, 2014).</p>
    <h2>Cara kerja QR</h2>
    <p>Setiap menu punya kode unik, misalnya <code>menu-nasi-telur</code>. QR berisi URL <code>index.html?menu=menu-nasi-telur</code>. Saat dibuka, aplikasi membaca parameter <code>menu</code>, mencarinya di katalog lokal, lalu menampilkan detail menu. Kode yang tidak dikenal memunculkan pesan dan tombol kembali ke katalog. Gambar QR dibuat langsung di browser tanpa layanan luar.</p>
    <h2>Batas pencegahan pencatatan ganda</h2>
    <p>Satu menu hanya bisa dicatat sekali untuk kombinasi <b>kode menu + tanggal + waktu makan</b>. Pemeriksaan ini dilakukan dari data di browser yang sama. Tanpa server, aplikasi <b>tidak bisa</b> mencegah pencatatan ganda di perangkat lain, di browser lain, atau setelah data browser dihapus. Tidak ada fingerprinting perangkat.</p>
    <h2>Penyimpanan data</h2>
    <p>Profil, pengaturan, database bahan, menu, dan riwayat disimpan di <b>localStorage</b> browser ini. Mode Demo dan Data Saya disimpan terpisah. Data tidak dikirim ke server mana pun dan tidak tersinkron otomatis. Gunakan Ekspor JSON untuk cadangan dan Impor JSON untuk memindahkan data.</p>
  </div></div>`;
}

/* ---------- 14. DEMO ---------- */
function buildDemo(){
  const s=freshState("demo");
  s.profile={nick:"Raka (SIMULASI)",age:16,sex:"L",weight:55,height:165,activity:"sedang"};
  const today=todayKey();
  const tmp={foods:s.foods};
  const snap=(id,g)=>{ const f=tmp.foods.find(x=>x.id===id); const per100={}; NKEYS.forEach(k=>per100[k]=toNum(f[k])); return {foodId:f.id,name:f.name,state:f.state,status:f.status,local:!!f.local,cat:f.cat,grams:g,per100}; };
  const fromMenu=mid=>{ const m=s.menus.find(x=>x.id===mid); return {name:m.name,menuId:m.id,cost:m.cost,items:m.items.map(i=>snap(i.foodId,i.grams))}; };
  const rot=["menu-nasi-telur","menu-ubi-edamame","menu-tempe-tahu","menu-jagung-pisang","menu-nasi-telur","menu-tempe-tahu"];
  const lunch=[["nasi-putih",200],["ayam-dada",60],["kangkung",60],["minyak-sawit",8]];
  const dinner=[["nasi-putih",180],["tempe",50],["tahu",50],["bayam",50],["minyak-sawit",8]];
  const add=(d,time,session,o)=>{ const now=new Date().toISOString(); s.logs.push({id:uid(),date:d,time,session,name:o.name,source:o.menuId?"menu":"manual",menuId:o.menuId||null,cost:o.cost??null,items:o.items,createdAt:now,updatedAt:now}); };
  for(let i=6;i>=1;i--){ const d=addDays(today,-i);
    if(i!==3) add(d,"06:30","sarapan",fromMenu(rot[i-1]));
    add(d,"12:30","siang",{name:"Makan siang (contoh)",cost:12000,items:lunch.map(([f,g])=>snap(f,g+(i%3)*10))});
    add(d,"19:00","malam",{name:"Makan malam (contoh)",cost:10000,items:dinner.map(([f,g])=>snap(f,g))});
  }
  add(today,"06:40","sarapan",fromMenu("menu-nasi-pecel"));
  return s;
}

/* ---------- 15. MODAL, KONFIRMASI, TOAST ---------- */
let lastFocus=null;
function xBtn(){ return `<button class="modal-x" data-action="close" aria-label="Tutup">${ICON.x}</button>`; }
function openModal(html,size){
  lastFocus = lastFocus || document.activeElement;
  document.getElementById("modal-root").innerHTML=`<div class="modal-bg" data-action="bg-close"><div class="modal ${size||""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const first=document.querySelector(".modal button, .modal input, .modal select"); if(first) first.focus();
}
function closeModal(){ document.getElementById("modal-root").innerHTML=""; if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){} lastFocus=null; }
function confirmDialog({title,body,ok,danger}){
  return new Promise(res=>{
    openModal(`<div class="modal-h"><h2>${esc(title)}</h2></div><p>${body}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cf-no">Batal</button><button class="btn ${danger?"danger solid":"primary"}" id="cf-yes">${esc(ok||"Ya")}</button></div>`,"sm");
    document.getElementById("cf-no").onclick=()=>{closeModal();res(false);};
    document.getElementById("cf-yes").onclick=()=>{closeModal();res(true);};
    document.getElementById("cf-no").focus();
  });
}
let toastT=null;
function toast(msg){ let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast("Disalin"); }catch(e){ const i=document.getElementById("qr-url"); if(i&&i.value===text){ i.select(); toast("Tekan Ctrl+C / Salin untuk menyalin"); } else { openModal(`<div class="modal-h"><h2>Salin data</h2>${xBtn()}</div><textarea id="copy-box" style="min-height:240px;font-family:monospace;font-size:.75rem">${esc(text)}</textarea><p class="small muted">Pilih semua teks lalu salin.</p>`); document.getElementById("copy-box").select(); } } }

/* ---------- 16. AKSI (event delegation) ---------- */
const ACTIONS = {
  "go": el=>{ closeModal(); go(el.dataset.view); },
  "close": ()=>closeModal(),
  "close-go": el=>{ closeModal(); go(el.dataset.view); },
  "bg-close": (el,e)=>{ if(e.target===el) closeModal(); },
  "dismiss-corrupt": ()=>{ notices.corrupt=false; renderBanners(); },
  "add-item": el=>{ const f=foodById(el.dataset.id); if(!f) return; draft.items.push({foodId:f.id,grams:f.def||100}); renderDraftItems(); renderTotals(); const inp=document.getElementById("g-"+(draft.items.length-1)); if(inp) inp.focus(); },
  "remove-item": el=>{ draft.items.splice(+el.dataset.idx,1); renderDraftItems(); renderTotals(); },
  "save-draft": ()=>saveDraft(),
  "clear-draft": ()=>{ draft=newDraft(); render(); },
  "cancel-edit": ()=>{ draft=newDraft(); go("riwayat"); },
  "edit-log": el=>editLog(el.dataset.id),
  "delete-log": async el=>{ const l=state.logs.find(x=>x.id===el.dataset.id); if(!l) return; const reopen=document.getElementById("rec-date")?l.menuId:null;
    if(await confirmDialog({title:"Batalkan catatan?",body:`<b>${esc(l.name)}</b> (${esc(sessionLabel(l.session))}, ${esc(dateLabel(l.date,{day:"numeric",month:"long"}))}) akan dihapus dari riwayat.`,ok:"Batalkan catatan",danger:true})){
      state.logs=state.logs.filter(x=>x.id!==l.id); saveState(); render(); toast("Catatan dibatalkan"); if(reopen) menuDetail(reopen,{date:l.date,session:l.session}); } },
  "ktab": el=>{ katalogTab=el.dataset.tab; render(); },
  "open-katalog-bahan": ()=>{ katalogTab="bahan"; go("katalog"); },
  "menu-detail": el=>menuDetail(el.dataset.id),
  "menu-qr": el=>menuQR(el.dataset.id),
  "menu-edit": el=>menuEdit(el.dataset.id),
  "menu-new": ()=>menuEdit(""),
  "menu-delete": async el=>{ const m=menuById(el.dataset.id); if(m && await confirmDialog({title:"Hapus menu?",body:`${esc(m.name)} akan dihapus dari katalog. QR menu ini akan menampilkan "menu tidak ditemukan". Riwayat lama tetap ada.`,ok:"Hapus menu",danger:true})){ state.menus=state.menus.filter(x=>x.id!==m.id); if(!Array.isArray(state.removedMenus)) state.removedMenus=[]; if(DEFAULT_MENUS.some(d=>d.id===m.id)) state.removedMenus.push(m.id); saveState(); render(); toast("Menu dihapus"); } },
  "menus-reset": async ()=>{ if(await confirmDialog({title:"Kembalikan menu bawaan?",body:"Semua perubahan dan menu buatanmu di katalog akan diganti dengan menu bawaan. Riwayat tidak berubah.",ok:"Kembalikan"})){ state.menus=clone(DEFAULT_MENUS); state.removedMenus=[]; saveState(); render(); toast("Menu bawaan dikembalikan"); } },
  "foods-reset": async ()=>{ if(await confirmDialog({title:"Kembalikan database bawaan?",body:"Nilai bahan yang kamu ubah dan bahan buatanmu akan diganti dengan data bawaan. Menu yang memakai bahan buatanmu perlu diperbaiki.",ok:"Kembalikan"})){ state.foods=clone(DEFAULT_FOODS); saveState(); render(); toast("Database bawaan dikembalikan"); } },
  "food-edit": el=>foodEdit(el.dataset.id),
  "record-menu": el=>recordMenu(el.dataset.id),
  "copy-url": ()=>copyText(document.getElementById("qr-url").value),
  "qr-download": el=>{ const img=document.getElementById("qr-img"); if(!img) return; fetch(img.src).then(r=>r.blob()).then(b=>downloadBlob(`qr-${el.dataset.id}.png`,b)).catch(()=>toast("Gagal menyimpan. Tekan lama gambar QR lalu pilih Simpan gambar.")); },
  "qr-print": el=>{ const m=menuById(el.dataset.id); const img=document.getElementById("qr-img"); if(!m||!img) return;
    document.getElementById("print-area").innerHTML=`<h1 style="font-family:sans-serif">SARAPAN PINTAR</h1><img src="${img.src}" alt="QR ${esc(m.name)}"><h2 style="font-family:sans-serif">${esc(m.name)}</h2><p style="font-family:monospace">${esc(menuUrl(m.id))}</p><p style="font-family:sans-serif">Pindai untuk melihat estimasi gizi dan mencatat sarapan.</p>`;
    document.body.classList.add("printing-qr"); try{ window.print(); }catch(e){ toast("Cetak tidak didukung di tampilan ini"); } setTimeout(()=>document.body.classList.remove("printing-qr"),800); },
  "export-json": ()=>{ if(downloadBlob(`sarapan-pintar-${mode}-${todayKey()}.json`,JSON.stringify(exportPayload(),null,2),"application/json")) toast("File JSON dibuat"); },
  "export-csv": ()=>{ if(downloadBlob(`riwayat-sarapan-pintar-${todayKey()}.csv`,exportCSV(),"text/csv;charset=utf-8")) toast("File CSV dibuat"); },
  "copy-json": ()=>copyText(JSON.stringify(exportPayload(),null,2)),
  "more-hist": ()=>{ histDays+=14; render(); },
  "switch-mode": async el=>{ const to=el.dataset.mode; setMode(to); notices.corrupt=false; draft=null; toast(to==="demo"?"Mode Demo aktif":"Beralih ke Data Saya"); go(to==="user"&&!state.profile?"profil":"dashboard"); },
  "reset-demo": async ()=>{ if(await confirmDialog({title:"Reset Demo?",body:"Data Mode Demo dikembalikan ke keadaan awal. Data Saya tidak terpengaruh.",ok:"Reset Demo"})){ Store.del(KEY+"demo"); setMode("demo"); draft=null; go("dashboard"); toast("Demo direset"); } },
  "wipe-all": async ()=>{ if(await confirmDialog({title:"Hapus seluruh data lokal?",body:"Profil, riwayat, menu, database bahan, dan pengaturan di <b>kedua mode</b> akan dihapus dari browser ini. Tindakan ini tidak bisa dibatalkan. Ekspor JSON dulu jika ingin menyimpan cadangan.",ok:"Hapus semua",danger:true})){
      Store.del(KEY+"user"); Store.del(KEY+"demo"); Store.del(KEY+"mode"); try{ Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      Store.mem={}; mode="user"; state=freshState("user"); Store.set(KEY+"mode","user"); saveState(); draft=null; go("profil"); toast("Seluruh data lokal dihapus"); } },
  "profile-clear": async ()=>{ if(await confirmDialog({title:"Hapus profil?",body:"Data diri dihapus. Riwayat tetap ada, tetapi target personal tidak ditampilkan lagi.",ok:"Hapus profil",danger:true})){ state.profile=null; saveState(); render(); toast("Profil dihapus"); } },
  "save-settings": ()=>{ const u=document.getElementById("s-base").value.trim(); if(u && !/^https?:\/\/[^\s]+$/i.test(u)){ toast("URL harus diawali http:// atau https://"); document.getElementById("s-base").setAttribute("aria-invalid","true"); return; }
    state.settings.qrBase=u; state.settings.useAkg=document.getElementById("s-akg").checked; saveState(); render(); toast("Pengaturan disimpan"); }
};
document.addEventListener("click",e=>{ const el=e.target.closest("[data-action]"); if(!el) return; const fn=ACTIONS[el.dataset.action]; if(!fn) return; if(el.tagName==="BUTTON"&&el.type==="submit"&&!el.dataset.action) return; if(el.dataset.action!=="bg-close") e.preventDefault(); try{ fn(el,e); }catch(err){ console.error(err); toast("Terjadi kesalahan: "+err.message); } });
document.addEventListener("change",e=>{
  if(e.target.id==="s-akg"){ state.settings.useAkg=e.target.checked; saveState(); render(); toast(e.target.checked?"Target AKG aktif":"Target AKG dimatikan"); }
  if(e.target.dataset && e.target.dataset.change==="import"){ const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=async()=>{ let o; try{ o=JSON.parse(r.result); }catch(err){ toast("Berkas bukan JSON yang valid"); return; }
      const bad=validateImport(o); if(bad){ openModal(`<div class="modal-h"><h2>Impor ditolak</h2>${xBtn()}</div><p>${esc(bad)}</p>`,"sm"); return; }
      if(await confirmDialog({title:"Impor data?",body:`Berkas berisi ${o.logs.length} catatan. Data di <b>${mode==="demo"?"Mode Demo":"Data Saya"}</b> akan diganti dengan isi berkas.`,ok:"Impor"})){
        state={schemaVersion:SCHEMA_VERSION,kind:mode,profile:o.profile||null,settings:{useAkg:o.settings?.useAkg!==false,qrBase:typeof o.settings?.qrBase==="string"?o.settings.qrBase:""},foods:o.foods,menus:o.menus,logs:o.logs}; saveState(); render(); toast("Data diimpor"); } };
    r.readAsText(file); e.target.value=""; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.querySelector(".modal-bg")) closeModal(); });

/* ---------- 17. MULAI ---------- */
function handleIncomingMenu(){
  let id=null;
  try{ id=new URLSearchParams(location.search).get("menu"); }catch(e){}
  if(!id && /^#menu-/.test(location.hash)) id=decodeURIComponent(location.hash.slice(1));
  if(id===null) return false;
  id=id.trim();
  katalogTab="menu"; view="katalog"; render();
  try{ history.replaceState(null,"",location.pathname+"#katalog"); }catch(e){}
  menuDetail(id);
  return true;
}
function start(){
  Store.init(); loadState();
  if(!handleIncomingMenu()){
    const h=location.hash.slice(1); view=VIEWS.includes(h)?h:"dashboard"; render();
  }
  setInterval(()=>{ const t=todayKey(); if(t!==lastToday){ lastToday=t; if(draft&&!draft.editingId) draft.date=t; render(); } },30000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && todayKey()!==lastToday){ lastToday=todayKey(); render(); } });
  window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(/^menu-/.test(h)) handleIncomingMenu(); else if(VIEWS.includes(h)&&h!==view){ view=h; render(); } });
}
try{ start(); }catch(err){ console.error(err); document.getElementById("view").innerHTML=`<div class="banner err" role="alert">Aplikasi gagal dimulai: ${esc(err.message)}. Coba muat ulang halaman.</div>`; }
</script>
